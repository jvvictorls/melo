services:
  web:
    build:
      context: .
      dockerfile: docker/web.Dockerfile
    ports:
      - "3000:3000"
    volumes:
      - ./apps/web:/app/apps/web
      - ./packages:/app/packages
    environment:
      NODE_ENV: development
    depends_on:
      - api
  api:
    build:
      context: .
      dockerfile: docker/api.Dockerfile
    command: sh -c "npm run build --workspace=@repo/db && npm run db:migrate:deploy --workspace=@repo/db && npm run db:seed --workspace=@repo/db && npm run dev --workspace=api"    
    ports:
      - "3001:3001"
    volumes:
      - ./apps/api:/app/apps/api
      - ./packages:/app/packages
    environment:
      NODE_ENV: development
      DATABASE_URL: postgresql://postgres:postgres@postgres:5432/melo
    depends_on:
      postgres:
        condition: service_healthy

  postgres:
    image: postgres:18-alpine
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d melo"]
      interval: 5s
      timeout: 5s
      retries: 5
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: melo
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql

volumes:
  postgres_data:
